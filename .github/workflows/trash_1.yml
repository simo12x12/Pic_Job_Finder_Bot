name: Pic Job Finder

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pic-job-finder
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Show files
        run: |
          pwd
          ls -la

      - name: Monitor job offers
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python monitor.py

      - name: Save job history
        run: |
          if git diff --quiet -- seen_jobs.json; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi

          git config user.name "Pic Job Finder Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add seen_jobs.json
          git commit -m "Update seen Leonardo jobs"
          git push

