name: Pic Job Finder

on:
  schedule:
    - cron: '*/6 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pic-job-finder
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Monitor job offers
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -u monitor.py

      - name: Process Telegram commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -u bot_commands.py

      - name: Save bot state
        run: |
          git config user.name "Pic Job Finder Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp seen_jobs.json /tmp/seen_jobs.json
          cp current_jobs.json /tmp/current_jobs.json
          cp bot_state.json /tmp/bot_state.json

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/seen_jobs.json seen_jobs.json
          cp /tmp/current_jobs.json current_jobs.json
          cp /tmp/bot_state.json bot_state.json

          git add seen_jobs.json current_jobs.json bot_state.json

          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi

          git commit -m "Update Pic Job Finder state"
          git push origin main
          
