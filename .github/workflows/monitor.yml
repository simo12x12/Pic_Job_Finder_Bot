name: Pic Job Finder

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pic-job-finder
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Monitor job offers
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python monitor.py

      - name: Save job history
        run: |
          if git diff --quiet -- seen_jobs.json; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi

          git config user.name "Pic Job Finder Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add seen_jobs.json
          git commit -m "Update seen Leonardo jobs"
          git push

      - name: Notify Telegram on failure
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=2020881944" \
            --data-urlencode "text=⚠️ PIC JOB FINDER - ERRORE

          Una sorgente del monitor non ha funzionato correttamente.

          Possibili cause:
          • Leonardo non raggiungibile
          • inPA non raggiungibile
          • struttura del sito modificata
          • errore GitHub Actions

          🔧 Controlla:
          https://github.com/${{ github.repository }}/actions

          🤖 Pic_Job_Finder_Bot"
